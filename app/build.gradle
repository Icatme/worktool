apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'org.yameida.worktool'
    compileSdk 36
    buildToolsVersion '35.0.0'
    buildFeatures { viewBinding true; buildConfig true }
    sourceSets {
        test.java.srcDirs += ['../tests/jvm', '../verification/src/test/java']
    }
    testOptions {
        unitTests.all { testLogging { events 'passed', 'failed', 'skipped' } }
    }

    defaultConfig {
        applicationId "org.yameida.worktool"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 28011
        versionName "2.8.1"
    }

    buildTypes {
        debug {
            // Local validation can package without creating or touching a signing credential.
            if (providers.gradleProperty('unsignedValidation').orNull == 'true') {
                signingConfig null
            }
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}
apply from: rootProject.file('scripts/dependency-inventory.gradle')

dependencies {
    implementation project(':baselibrary')
    implementation project(':floatwindow')
    implementation files('libs/lib_wwapi-2.0.12.11.aar')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'

}
