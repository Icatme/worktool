apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'base'
    compileSdk 36
    buildToolsVersion '35.0.0'
    buildFeatures { viewBinding true; buildConfig true }
    kotlinOptions { jvmTarget = '1.8' }

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            // App-level R8 sees cross-module callers; shrinking this AAR first deletes public APIs.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

}

dependencies {
    api 'org.jetbrains.kotlin:kotlin-stdlib:2.3.10'
    api 'androidx.core:core-ktx:1.15.0'
    api 'androidx.appcompat:appcompat:1.7.1'
    api 'com.google.android.material:material:1.12.0'
    api 'com.blankj:utilcodex:1.31.1'
    api 'com.google.code.gson:gson:2.13.2'
    api 'com.squareup.okhttp3:okhttp:4.12.0'
    api 'com.google.zxing:core:3.5.3'
    api 'com.qmuiteam:qmui:2.0.1'
    api 'androidx.recyclerview:recyclerview:1.3.2'
    api 'com.github.bumptech.glide:glide:4.16.0'
    api 'com.github.bumptech.glide:okhttp3-integration:4.16.0'
}
